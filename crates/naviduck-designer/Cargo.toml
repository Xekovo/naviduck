[package]
name = "naviduck-designer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Table structure designer for naviduck."

[dependencies]
naviduck-session = { path = "../naviduck-session" }
naviduck-ui.workspace = true
naviduck-util.workspace = true
naviduck-model.workspace = true
naviduck-sql = { path = "../naviduck-sql" }
naviduck-app-state.workspace = true
naviduck-db.workspace = true
naviduck-schema = { path = "../naviduck-schema" }
gpui-kit = { workspace = true, features = ["tree-sitter-sql"] }
anyhow.workspace = true
lsp-types = "0.97"
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
naviduck-postgres = { path = "../naviduck-postgres" }
naviduck-sqlite = { path = "../naviduck-sqlite" }
gpui-kit = { workspace = true, features = ["test-support", "tree-sitter-sql"] }
